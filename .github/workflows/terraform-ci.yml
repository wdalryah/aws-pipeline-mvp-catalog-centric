name: Terraform CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline to deploy"
        required: true
        type: choice
        options:
          - acme/finance/processing
          - acme/finance/ingestion

  pull_request:
    branches:
      - prelive

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION:   "1.7.0"
  AWS_REGION:   "eu-north-1"
  TF_WORKING_DIR: "infra/terraform/environments/prelive"
  GITHUB_OWNER: "wdalryah"
  GITHUB_REPO:  "aws-pipeline-mvp-catalog-centric"
  OIDC_ROLE:    "arn:aws:iam::418638389153:role/GitHubActions-datalake-medallion"

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # --------------------------------------------------------------------------
  # 0. Resolve which layer was selected (dispatch only)
  # --------------------------------------------------------------------------
  resolve-pipeline:
    name: "Resolve pipeline"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      layer: ${{ steps.parse.outputs.layer }}
    steps:
      - name: Parse pipeline input
        id: parse
        run: |
          PIPELINE="${{ github.event.inputs.pipeline }}"
          LAYER=$(echo "$PIPELINE" | awk -F'/' '{print $3}')
          echo "layer=$LAYER" >> "$GITHUB_OUTPUT"
          echo "Selected pipeline : $PIPELINE"
          echo "Resolved layer    : $LAYER"

  # --------------------------------------------------------------------------
  # 1. tf-init — checkout + terraform init
  #    Runs for both processing (dispatch) and PR validation.
  # --------------------------------------------------------------------------
  tf-init:
    name: "1 · Init"
    runs-on: ubuntu-latest
    needs: [resolve-pipeline]
    if: always() && (github.event_name == 'pull_request' || needs.resolve-pipeline.outputs.layer == 'processing')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      # Cache the .terraform directory for downstream jobs
      - name: Cache Terraform plugins
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl') }}

  # --------------------------------------------------------------------------
  # 2. tf-validate — fmt check + validate
  # --------------------------------------------------------------------------
  tf-validate:
    name: "2 · Validate"
    runs-on: ubuntu-latest
    needs: [resolve-pipeline, tf-init]
    if: always() && (github.event_name == 'pull_request' || needs.resolve-pipeline.outputs.layer == 'processing')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform validate
        run: terraform validate

  # --------------------------------------------------------------------------
  # 3. tf-plan — generate plan and post summary to PR / workflow run
  # --------------------------------------------------------------------------
  tf-plan:
    name: "3 · Plan"
    runs-on: ubuntu-latest
    needs: [resolve-pipeline, tf-validate]
    if: always() && (github.event_name == 'pull_request' || needs.resolve-pipeline.outputs.layer == 'processing')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var="github_owner=${{ env.GITHUB_OWNER }}" \
            -var="github_repo=${{ env.GITHUB_REPO }}" \
            2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan summary
        run: |
          echo "## Terraform Plan — acme/finance/processing" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.txt
          retention-days: 5

  # --------------------------------------------------------------------------
  # 4. tf-deploy — apply the saved plan (dispatch only, gated on environment)
  #    GitHub environment "prelive" provides the manual approval gate.
  # --------------------------------------------------------------------------
  tf-deploy:
    name: "4 · Deploy"
    runs-on: ubuntu-latest
    needs: [resolve-pipeline, tf-plan]
    if: github.event_name == 'workflow_dispatch' && needs.resolve-pipeline.outputs.layer == 'processing'
    environment: prelive
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Post deploy summary
        run: |
          echo "## Deploy complete — acme/finance/processing" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' >> $GITHUB_STEP_SUMMARY

      - name: Upload Glue scripts to S3
        run: |
          BUCKET=$(terraform output -raw data_lake_bucket_name)
          aws s3 sync ../../processing/common_code/ \
            s3://${BUCKET}/scripts/processing/ \
            --exclude "*.pyc" --exclude "__pycache__/*" \
            --region ${{ env.AWS_REGION }}
          echo "Scripts → s3://${BUCKET}/scripts/processing/" >> $GITHUB_STEP_SUMMARY

      - name: Upload Airflow DAGs to S3
        run: |
          MWAA_BUCKET=$(terraform output -raw mwaa_bucket_name)
          aws s3 sync ../../../workflow/dags/ \
            s3://${MWAA_BUCKET}/dags/ \
            --region ${{ env.AWS_REGION }}
          aws s3 cp ../../../workflow/requirements.txt \
            s3://${MWAA_BUCKET}/requirements.txt \
            --region ${{ env.AWS_REGION }}
          echo "DAGs → s3://${MWAA_BUCKET}/dags/" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------------------
  # Ingestion deploy — placeholder, triggered when layer == 'ingestion'
  # --------------------------------------------------------------------------
  deploy-ingestion:
    name: "Deploy: acme/finance/ingestion"
    runs-on: ubuntu-latest
    needs: resolve-pipeline
    if: needs.resolve-pipeline.outputs.layer == 'ingestion'
    environment: prelive
    steps:
      - uses: actions/checkout@v4

      - name: Ingestion layer placeholder
        run: |
          echo "## acme/finance/ingestion" >> $GITHUB_STEP_SUMMARY
          echo "DMS and table mapping configuration will be deployed here in a future iteration." >> $GITHUB_STEP_SUMMARY
          echo "Current assumption: tables are pre-landed in s3://datalake-medallion-prelive-eu-north-1/raw/landing/" >> $GITHUB_STEP_SUMMARY
          ls ingestion/
