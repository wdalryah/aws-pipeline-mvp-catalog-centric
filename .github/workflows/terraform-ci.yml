name: Terraform CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  # Manual dispatch: select the layer to deploy.
  # Account and region are fixed to the connected AWS account (eu-north-1).
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline to deploy"
        required: true
        type: choice
        options:
          - acme/finance/processing
          - acme/finance/ingestion

  # Automatic validation on PRs targeting prelive
  pull_request:
    branches:
      - prelive

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read
  pull-requests: write

env:
  TF_VERSION:   "1.7.0"
  AWS_REGION:   "eu-north-1"
  TF_ROOT:      "infra/terraform/environments/prelive"
  GITHUB_OWNER: "wdalryah"
  GITHUB_REPO:  "aws-pipeline-mvp-catalog-centric"
  OIDC_ROLE:    "arn:aws:iam::418638389153:role/GitHubActions-datalake-medallion"

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # --------------------------------------------------------------------------
  # Debug: print the exact OIDC sub claim GitHub sends — remove after fix.
  # --------------------------------------------------------------------------
  debug-oidc:
    name: "Debug OIDC token claims"
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token and print sub
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode the payload (middle section of the JWT)
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d'.' -f2)
          # Pad base64 to a multiple of 4
          PADDED="${PAYLOAD}$(printf '%0.s=' $(seq 1 $((4 - ${#PAYLOAD} % 4))))"
          echo "$PADDED" | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, environment, job_workflow_ref}'

  # --------------------------------------------------------------------------
  # Parse the pipeline input into a layer output consumed by downstream jobs.
  # Only runs on workflow_dispatch.
  # --------------------------------------------------------------------------
  resolve-pipeline:
    name: "Resolve pipeline"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      layer: ${{ steps.parse.outputs.layer }}
    steps:
      - name: Parse pipeline input
        id: parse
        # Input format: acme/finance/<layer>  e.g. acme/finance/processing
        run: |
          PIPELINE="${{ github.event.inputs.pipeline }}"
          LAYER=$(echo "$PIPELINE" | awk -F'/' '{print $3}')
          echo "Resolved layer: [$LAYER]"
          echo "layer=$LAYER" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Terraform validate — runs on every PR to prelive, no apply.
  # --------------------------------------------------------------------------
  terraform-validate:
    name: "Terraform Validate (prelive)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra/terraform/environments/prelive
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # --------------------------------------------------------------------------
  # Processing deploy — triggered only when layer == 'processing'
  # --------------------------------------------------------------------------
  deploy-processing:
    name: "Deploy: acme/finance/processing"
    runs-on: ubuntu-latest
    needs: resolve-pipeline
    # Single-line condition avoids GitHub Actions multi-line if-expression bug
    if: needs.resolve-pipeline.outputs.layer == 'processing'
    environment: prelive
    defaults:
      run:
        working-directory: infra/terraform/environments/prelive
    steps:
      - uses: actions/checkout@v4

      - name: Confirm selected layer
        run: echo "Deploying layer=[${{ needs.resolve-pipeline.outputs.layer }}] pipeline=[${{ github.event.inputs.pipeline }}]"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_github_owner: ${{ env.GITHUB_OWNER }}
          TF_VAR_github_repo:  ${{ env.GITHUB_REPO }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-processing
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_github_owner: ${{ env.GITHUB_OWNER }}
          TF_VAR_github_repo:  ${{ env.GITHUB_REPO }}

      - name: Upload Glue scripts to S3
        run: |
          BUCKET=$(terraform output -raw data_lake_bucket_name)
          aws s3 sync ../../processing/common_code/ \
            s3://${BUCKET}/scripts/processing/ \
            --exclude "*.pyc" --exclude "__pycache__/*" \
            --region ${{ env.AWS_REGION }}

      - name: Upload Airflow DAGs to S3
        run: |
          MWAA_BUCKET=$(terraform output -raw mwaa_bucket_name)
          aws s3 sync ../../../workflow/dags/ \
            s3://${MWAA_BUCKET}/dags/ \
            --region ${{ env.AWS_REGION }}
          aws s3 cp ../../../workflow/requirements.txt \
            s3://${MWAA_BUCKET}/requirements.txt \
            --region ${{ env.AWS_REGION }}

  # --------------------------------------------------------------------------
  # Ingestion deploy — triggered only when layer == 'ingestion'
  # Placeholder: DMS config will be added in a future iteration.
  # --------------------------------------------------------------------------
  deploy-ingestion:
    name: "Deploy: acme/finance/ingestion"
    runs-on: ubuntu-latest
    needs: resolve-pipeline
    # Single-line condition avoids GitHub Actions multi-line if-expression bug
    if: needs.resolve-pipeline.outputs.layer == 'ingestion'
    environment: prelive
    steps:
      - uses: actions/checkout@v4

      - name: Confirm selected layer
        run: echo "Deploying layer=[${{ needs.resolve-pipeline.outputs.layer }}] pipeline=[${{ github.event.inputs.pipeline }}]"

      - name: Ingestion layer placeholder
        run: |
          echo "acme/finance/ingestion selected."
          echo "DMS and table mapping configuration will be deployed here in a future iteration."
          echo "Current assumption: tables are pre-landed in:"
          echo "  s3://datalake-medallion-prelive-eu-north-1/raw/landing/"
          ls ingestion/
