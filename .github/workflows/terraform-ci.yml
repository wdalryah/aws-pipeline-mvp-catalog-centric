name: Terraform CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  # Manual dispatch: select the layer to deploy.
  # Account and region are fixed to the connected AWS account (eu-north-1).
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline to deploy"
        required: true
        type: choice
        options:
          - acme/finance/ingestion
          - acme/finance/processing

  # Automatic validation on PRs targeting prelive
  pull_request:
    branches:
      - prelive

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read
  pull-requests: write

env:
  TF_VERSION:  "1.7.0"
  AWS_REGION:  "eu-north-1"
  TF_ROOT:     "infra/terraform/environments/prelive"

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # --------------------------------------------------------------------------
  # Determine which layer is being deployed (dispatch only)
  # --------------------------------------------------------------------------
  resolve-pipeline:
    name: "Resolve pipeline"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      layer: ${{ steps.parse.outputs.layer }}
    steps:
      - name: Parse pipeline input
        id: parse
        run: |
          PIPELINE="${{ github.event.inputs.pipeline }}"
          # Format: acme/finance/<layer>
          LAYER=$(echo "$PIPELINE" | cut -d'/' -f3)
          echo "layer=$LAYER" >> "$GITHUB_OUTPUT"
          echo "Resolved layer: $LAYER"

  # --------------------------------------------------------------------------
  # Terraform: validate on PR
  # --------------------------------------------------------------------------
  terraform-validate:
    name: "Terraform Validate (prelive)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra/terraform/environments/prelive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # --------------------------------------------------------------------------
  # Processing pipeline deploy (manual dispatch: acme/finance/processing)
  # --------------------------------------------------------------------------
  deploy-processing:
    name: "Deploy: acme/finance/processing"
    runs-on: ubuntu-latest
    needs: resolve-pipeline
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.resolve-pipeline.outputs.layer == 'processing'
    environment: prelive
    defaults:
      run:
        working-directory: infra/terraform/environments/prelive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_github_owner: ${{ secrets.GITHUB_ORG }}
          TF_VAR_github_repo:  ${{ github.event.repository.name }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-processing
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_github_owner: ${{ secrets.GITHUB_ORG }}
          TF_VAR_github_repo:  ${{ github.event.repository.name }}

      - name: Upload Glue scripts to S3
        run: |
          BUCKET=$(terraform output -raw data_lake_bucket_name)
          aws s3 sync ../../processing/common_code/ \
            s3://${BUCKET}/scripts/processing/ \
            --exclude "*.pyc" --exclude "__pycache__/*" \
            --region ${{ env.AWS_REGION }}

      - name: Upload Airflow DAGs to S3
        run: |
          MWAA_BUCKET=$(terraform output -raw mwaa_bucket_name)
          aws s3 sync ../../../workflow/dags/ \
            s3://${MWAA_BUCKET}/dags/ \
            --region ${{ env.AWS_REGION }}
          aws s3 cp ../../../workflow/requirements.txt \
            s3://${MWAA_BUCKET}/requirements.txt \
            --region ${{ env.AWS_REGION }}

  # --------------------------------------------------------------------------
  # Ingestion pipeline deploy (manual dispatch: acme/finance/ingestion)
  # Placeholder — DMS config will be added in a future iteration.
  # --------------------------------------------------------------------------
  deploy-ingestion:
    name: "Deploy: acme/finance/ingestion"
    runs-on: ubuntu-latest
    needs: resolve-pipeline
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.resolve-pipeline.outputs.layer == 'ingestion'
    environment: prelive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ingestion layer placeholder
        run: |
          echo "Ingestion layer selected: acme/finance/ingestion"
          echo "DMS and table mapping configuration will be deployed here."
          echo "Current assumption: tables are pre-landed in s3://datalake-medallion-prelive-eu-north-1/raw/landing/"
          ls ingestion/
